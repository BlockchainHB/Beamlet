name: Beamlet
options:
  bundleIdPrefix: app.beamlet
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 3
packages:
  BeamletCore:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  BeamletRunner:
    type: tool
    platform: macOS
    sources: [Sources/Runner]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.beamlet.runner
        SKIP_INSTALL: YES
  Beamlet:
    type: application
    platform: macOS
    sources:
      - Sources/App
      - path: Resources/Beamlet.icon
        type: file
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Sparkle-LICENSE.txt
        buildPhase: resources
      - path: Resources/Beamlet-LICENSE.txt
        buildPhase: resources
    dependencies:
      - package: BeamletCore
      - package: Sparkle
      - target: BeamletRunner
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.beamlet.mac
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: Beamlet
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    postBuildScripts:
      - name: Embed process runner
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          mkdir -p "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          cp "${BUILT_PRODUCTS_DIR}/BeamletRunner" "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/BeamletRunner"
          if [ "${CODE_SIGNING_ALLOWED:-NO}" = YES ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            /usr/bin/codesign --force --options runtime --timestamp=none --sign "${EXPANDED_CODE_SIGN_IDENTITY}" "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/BeamletRunner"
          fi
  BeamletRunnerStore:
    type: tool
    platform: macOS
    sources: [Sources/Runner]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.beamlet.mac.runner
        CODE_SIGN_ENTITLEMENTS: Resources/Runner-AppStore.entitlements
        SKIP_INSTALL: YES
  BeamletStore:
    type: application
    platform: macOS
    sources:
      - Sources/App
      - path: Resources/Beamlet.icon
        type: file
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: BeamletCore
      - target: BeamletRunnerStore
        embed: false
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.beamlet.mac
        INFOPLIST_FILE: Resources/Info-AppStore.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: Beamlet
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
        CODE_SIGN_ENTITLEMENTS: Resources/AppStore.entitlements
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
    postBuildScripts:
      - name: Embed sandboxed process runner
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          mkdir -p "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          cp "${BUILT_PRODUCTS_DIR}/BeamletRunnerStore" "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/BeamletRunner"
          if [ "${CODE_SIGNING_ALLOWED:-NO}" = YES ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            /usr/bin/codesign --force --options runtime --timestamp=none --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --entitlements "${SRCROOT}/Resources/Runner-AppStore.entitlements" "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/BeamletRunner"
          fi
schemes:
  Beamlet:
    build:
      targets:
        Beamlet: all
    run:
      config: Debug
    archive:
      config: Release
  BeamletStore:
    build:
      targets:
        BeamletStore: all
    run:
      config: Debug
    archive:
      config: Release
